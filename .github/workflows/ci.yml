# Bud API — CI
#
# checks  typecheck, lint, format, unit tests
# e2e     migrations applied to a real Postgres, then the API boots against it
# image   builds the production image; pushes to GHCR on main only
#
# Mirrors Tech-Information.md section 9 for the API half.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs are cancelled everywhere except main, where a run may be
  # migrating the production database: killing `prisma migrate deploy` part
  # way leaves a failed migration that blocks every later one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    name: e2e (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: checks
    # Both ways of serving course content, and both places files can live:
    # - shared port, S3: the free deploy exactly (render.yaml) — content on the
    #   API's one public port, files in an S3 bucket (Neon Object Storage there,
    #   MinIO here);
    # - own listener, Postgres: the self-hosted listener, with the database
    #   storage driver, so neither goes untested.
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: shared port, S3
            courses_port: '3102'
            courses_origin: http://127.0.0.1:3102
            storage_driver: s3
          - mode: own listener, Postgres
            courses_port: '3101'
            courses_origin: http://127.0.0.1:3101
            storage_driver: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bud
          POSTGRES_PASSWORD: bud
          POSTGRES_DB: bud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bud -d bud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # MinIO is started as a step below, not here: a service container cannot
      # be given a command, and MinIO without `server /data` prints its help
      # text and exits. That is how this job failed the first time it ran.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bud:bud@localhost:5432/bud?schema=public
      APP_ORIGIN: http://localhost:3100
      COURSES_ORIGIN: ${{ matrix.courses_origin }}
      API_ORIGIN: http://localhost:3102
      STORAGE_DRIVER: ${{ matrix.storage_driver }}
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: bud-courses
      # The MinIO root credentials below. They must match, and MinIO refuses a
      # root password shorter than eight characters.
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SEED_ADMIN_PASSWORD: ci-admin-password
      # The public demo, so its suite runs rather than skipping.
      DEMO_MODE: 'true'
    steps:
      # Course ingestion writes to object storage, so the e2e job needs a real
      # S3 endpoint rather than a mock: getting the content types, prefixes and
      # path-style addressing wrong is exactly what this job should catch.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready; then echo "MinIO ready"; exit 0; fi
            sleep 1
          done
          docker logs minio
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Migrations are code and run as their own step — exactly as in deploy.
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build

      - name: Boot the API and probe it
        env:
          # Serve course content too, so the course-serving suite runs rather
          # than skipping.
          COURSES_PORT: ${{ matrix.courses_port }}
        run: |
          node dist/main.js &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3102/ready; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3102/ready

      - name: Ingest and publish the Docker course
        run: |
          npm run course:ingest -- test/fixtures/course-package --publish

      - name: Sign in as the seeded admin
        run: |
          curl -fsS -c cookies.txt -X POST http://localhost:3102/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@bud.local","password":"ci-admin-password"}'
          echo
          curl -fsS -b cookies.txt http://localhost:3102/me
          echo
          # Without the cookie, /me must refuse.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3102/me)" = "401"

      - name: The catalog serves the course it just ingested
        run: |
          curl -fsS -b cookies.txt http://localhost:3102/courses | tee /tmp/catalog.json
          echo
          # One published course, with all ten sessions counted from the manifest.
          test "$(jq -r '.courses | length' /tmp/catalog.json)" = "1"
          test "$(jq -r '.courses[0].slug' /tmp/catalog.json)" = "docker-fundamentals"
          test "$(jq -r '.courses[0].sessionCount' /tmp/catalog.json)" = "10"

          curl -fsS -b cookies.txt http://localhost:3102/courses/docker-fundamentals > /tmp/detail.json
          # The outline is read back out of object storage, so this proves the
          # upload round-tripped rather than merely that rows were written.
          test "$(jq -r '.outlineMarkdown | length > 100' /tmp/detail.json)" = "true"
          test "$(jq -r '.sessions | length' /tmp/detail.json)" = "10"

      # The bridge, the storage limits, progress and course serving, over real
      # HTTP against this Postgres and this MinIO. These endpoints fail in ways
      # that cost a learner their work rather than showing an error page, which
      # is why they are exercised end to end and not only in unit tests.
      #
      # The suite skips when it cannot reach the API — right on a laptop with
      # nothing booted, wrong here, where a silent skip looks exactly like a
      # pass. So assert that a plausible number of assertions actually ran.
      - name: Player endpoints end to end
        env:
          E2E_API_BASE: http://localhost:3102
          E2E_COURSES_BASE: ${{ matrix.courses_origin }}
        run: |
          npm run test:e2e -- --reporter=default --reporter=json --outputFile=/tmp/e2e.json
          passed=$(jq -r '.numPassedTests' /tmp/e2e.json)
          echo "e2e assertions that ran: $passed"
          # 74 when every suite runs. Each suite skips rather than fails when
          # its precondition is missing, so a floor is what stops a silent skip
          # from passing as a green run — course serving (13) proves the
          # course/API split, and the demo (6) needs DEMO_MODE above.
          test "$passed" -ge 70

  # Production migrations, once per deploy. Render's free plan has no
  # pre-deploy step, and its containers restart on every wake from sleep, so
  # migrating at start would run on every cold start — and a failed migration
  # would then stop even the last good release from starting. Here it runs
  # once, before the new code can be deployed: render.yaml deploys only when
  # every check on the commit has passed, this job included.
  migrate:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never two at once against the same database.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply pending migrations to production
        env:
          # Neon's DIRECT connection string — migrations fail through the
          # pooler. Set as a repository secret; see Planning/Deploy-Guide.md.
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::No DATABASE_URL_UNPOOLED secret: no production database to migrate."
            exit 0
          fi
          case "$DATABASE_URL" in
            *-pooler.*)
              echo "::error::DATABASE_URL_UNPOOLED points at Neon's pooler (-pooler in the host). Migrations need the direct connection string."
              exit 1
              ;;
          esac
          npx prisma migrate deploy

  image:
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bud-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build once into the local daemon so it can be scanned on every run,
      # including PRs where nothing is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: bud-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bud-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Visible, not blocking, until the baseline is clean.
          exit-code: '0'

      # Same build, fully cached, now pushed with the real tags.
      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
