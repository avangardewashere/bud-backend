<meta charset="utf-8">
<title>There is a cover on this one</title>
<h1>There is a cover on this one</h1>

<p>
  This session exists so the package it belongs to is a real course: it saves
  through the bridge, the way every worksheet does.
</p>

<label for="note">Anything at all</label>
<input id="note" type="text">

<script>
  const input = document.getElementById('note');
  const KEY = 'cover-check:state';

  // `storage.get` resolves to { value } — a JSON string or null — which is the
  // shape the Docker worksheets already expect. Overall Plan §3 has the contract.
  window.storage.get(KEY).then((result) => {
    if (result && result.value) {
      input.value = JSON.parse(result.value).note ?? '';
    }
  });

  input.addEventListener('input', () => {
    window.storage.set(KEY, JSON.stringify({ note: input.value }));
  });
</script>
